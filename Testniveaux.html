<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Labyrinthe</title>
  <style>
    body { font-family: monospace; background:#111; color:#eee; }
    #maze { white-space: pre; font-size:16px; line-height:1.2; }
    input { width: 300px; padding:5px; background:#222; color:#eee; border:1px solid #555; }
    button { padding:5px 10px; margin-left:5px; }
  </style>
</head>
<body>

<h2>Labyrinthe — Commandes : forward, back, left, right</h2>

<div id="maze"></div>

<p>Commande :</p>
<input id="cmd" type="text" placeholder="forward">
<button onclick="runCommand()">Exécuter</button>

<p id="msg"></p>

<script>
  let maze1 = [
    "####################",
    "#P       #         #",
    "##### ## # ######  #",
    "#     #  #      #  #",
    "# ### #### #### #  #",
    "#   #      #    # #",
    "### ###### ###### #",
    "#        #        #",
    "# ###### # ###### #",
    "#        #      O #",
    "####################"
  ].map(r => r.split(""));

  let maze2 = [
    "#############",
    "#    P#     #",
    "# ##### ### #",
    "# #   #   # #",
    "# # ##### # #",
    "# #       # O",
    "# #######X###",
    "# #         #",
    "# ##### #####",
    "#           #",
    "#############"
  ].map(r => r.split(""));

  let maze3 = [
    "###############",
    "#  P#       # #",
    "# # # ##### # #",
    "# #   #   #   #",
    "# ##### # ### #",
    "#   # X #     #",
    "###X#X# ##### #",
    "#   # #     # #",
    "# ### ##### # #",
    "#     #     # #",
    "#######O#######"
  ].map(r => r.split(""));

  let maze4 = [
    "###############",
    "#   P#   X #  #",
    "# ### ### ### #",
    "#   #   #     #",
    "### #X##### # #",
    "#   #     # # #",
    "# ### ### # #X#",
    "#     #   #   #",
    "# ### ### ### #",
    "#     #   X O #", 
    "###############"

  ].map(r => r.split(""));

  let maze5 = [ 
    "#########################",
    "#P    #   X     #     # #",
    "# ### # ##### ### ### # #" ,   
    "# #   #     #   #   #   #",
    "# # ####### ### # ##### #" ,
    "# #       #     #     # #",
    "# ####### ##### ##### # #",
    "#   X   #     #     #   #",
    "### ### ##### ### # ### #",
    "#     #     #   # #     #",
    "# ### ##### ### # ##### #",
    "#   #     #   # #   X   #",
    "# # ##### ### # ##### # #",
    "# #     #     #     # # #",
    "# ##### ##### ##### # # #",
    "#     #     #     #   #O#",
    "#########################"

  ].map(r => r.split(""));

  let maze = maze1;

  let playerX = 0, playerY = 0;

  function findPlayer() {
    for (let y = 0; y < maze.length; y++) {
      for (let x = 0; x < maze[y].length; x++) {
        if (maze[y][x] === "P") {
          playerX = x;
          playerY = y;
          return;
        }
      }
    }
  }

  function renderMaze() {
    document.getElementById("maze").textContent =
      maze.map(row => row.join("")).join("\n");
  }

  function kill(player) {}

  function move(dx, dy) {
    const newX = playerX + dx;
    const newY = playerY + dy;
    const cell = maze[newY][newX];

    if (cell === "#") return;

    if (cell === "X") return 

    if (cell === "O") {
      maze[playerY][playerX] = " ";
      playerX = newX; playerY = newY;
      maze[playerY][playerX] = "P";
      renderMaze();
      document.getElementById("msg").textContent = " Bravo Gabriel, tu as trouvé la sortie !";

      maze = maze2;
      findPlayer();
      renderMaze();

      maze = maze3;
      findPlayer();
      renderMaze();
      return;
    }

    maze[playerY][playerX] = " ";
    playerX = newX; playerY = newY;
    maze[playerY][playerX] = "P";
    renderMaze();
  }

  function forward()  { move(0, -1); }
  function back()     { move(0,  1); }
  function left()     { move(-1, 0); }
  function right()    { move(1,  0); }

  function runCommand() {
    const cmd = document.getElementById("cmd").value.trim();
    const msg = document.getElementById("msg");
    msg.textContent = "";

    if (cmd === "forward") forward();
    else if (cmd === "back") back();
    else if (cmd === "left") left();
    else if (cmd === "right") right();
    else msg.textContent = "Commande invalide.";

    document.getElementById("cmd").value = "";
    document.getElementById("cmd").focus();
  }

  document.getElementById("cmd").addEventListener("keydown", function(e) {
    if (e.key === "Enter") runCommand();
  });

  findPlayer();
  renderMaze();
</script>

</body>
</html>
